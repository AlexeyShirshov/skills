name: publish-npm

# Stages a plugin release on npm via OIDC trusted publishing — no long-lived tokens, and no
# unreviewed publish: the CI only offers the version, a maintainer approves it with 2FA.
# The tag carries the version and must match package.json (the workflow refuses a mismatch, so the
# registry version is always the one the repo shows).
#
#   git tag opencode-sidebar-plugins-v1.0.0 && git push origin opencode-sidebar-plugins-v1.0.0
#   npx --yes npm@latest stage list && npx --yes npm@latest stage approve <id>   # approve
#
# A package must already exist on npm before trusted publishing can be configured for it:
# the first version is published once by a maintainer as a staged publish —
# `npx --yes npm@latest stage publish --access public`, then `npm stage approve <id>` (2FA) —
# because the account requires proof of presence and a plain `npm publish` fails with EOTP
# (npmjs.com → Packages → <package> → Settings → Trusted publishing → GitHub Actions, with
#   Organization or user: AlexeyShirshov
#   Repository:           skills
#   Workflow filename:    publish-npm.yml
#   Allowed actions:      leave the default (stage-only) — the workflow stages, it never publishes)
#
# Adding a package: add its tag pattern to `on.push.tags` and a case arm to the `resolve` job.
on:
  push:
    tags:
      - "opencode-roslyn-v*"
      - "opencode-sidebar-plugins-v*"
      - "zen-failover-v*"
      - "opencode-clear-session-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. opencode-sidebar-plugins-v1.0.0)"
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.tag.outputs.package }}
      directory: ${{ steps.tag.outputs.directory }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Read the package from the tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            opencode-roslyn-v*) PACKAGE=opencode-roslyn; DIRECTORY=opencode/plugins/opencode-roslyn ;;
            opencode-sidebar-plugins-v*) PACKAGE=opencode-sidebar-plugins; DIRECTORY=opencode/plugins/sidebar-plugins ;;
            zen-failover-v*) PACKAGE=zen-failover; DIRECTORY=opencode/plugins/zen-failover ;;
            opencode-clear-session-v*) PACKAGE=opencode-clear-session; DIRECTORY=opencode/plugins/clear-session ;;
            *) echo "::error::unknown release tag: $TAG"; exit 1 ;;
          esac
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#"$PACKAGE"-v}" >> "$GITHUB_OUTPUT"
          echo "releasing $PACKAGE from $DIRECTORY"

  npm:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.directory }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm CLI >= 11.5.1 and Node >= 22.14.0.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - name: Check the tag matches package.json
        shell: bash
        env:
          PACKAGE: ${{ needs.resolve.outputs.package }}
          WANT: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          HAVE="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::tag says $WANT but package.json says $HAVE"
            exit 1
          fi
          echo "publishing $PACKAGE $HAVE"

      # A full `npm test` where the suite is self-contained. zen-failover's suite is an
      # end-to-end run against the real `opencode` binary and mock providers on localhost,
      # so CI only parses its entrypoint.
      - name: Smoke test
        if: needs.resolve.outputs.package != 'zen-failover'
        run: npm test

      - name: Smoke test (syntax only)
        if: needs.resolve.outputs.package == 'zen-failover'
        run: node --check index.js

      # Staged publishing: the CI only *offers* the version, a maintainer approves it with 2FA
      # (`npm stage approve` or the package page on npmjs.com). That is what lets the trusted
      # publisher keep its default stage-only rights instead of "Allow npm publish".
      # npm detects the OIDC environment and uses it before any token.
      - name: Stage the release
        run: |
          npm install -g npm@latest   # `npm stage` needs npm >= 11.5.1
          npm stage publish
