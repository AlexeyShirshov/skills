name: pdca-role-assets

# Bounded guard for the shared PDCA role assets and the base entry/planning
# rules: the six canonical roles and their generated overlay mirrors must stay
# byte-identical, every agent frontmatter must parse as real YAML (a malformed
# block makes the host refuse to register the agent at all), and the focused
# entry/forms/routing/contract guards run when the base skill, its references or
# a canonical role changes. No network integration, no host requirements, no
# publication.

on:
  push:
    paths:
      - "skills/pdca*/**/*.py"
      - "skills/pdca*/tests/**"
      - "tests/pdca/test_skill_payload.py"
      - "skills/pdca/assets/opencode-agents/**"
      - "skills/pdca-coder/assets/opencode-agents/**"
      - "skills/pdca-dotnet/assets/opencode-agents/**"
      - "skills/pdca-collection/assets/opencode-agents/**"
      - "skills/pdca-incremental/assets/opencode-agents/**"
      - "tools/pdca/sync_role_assets.py"
      - "tests/pdca/test_role_assets.py"
      - "skills/pdca/SKILL.md"
      - "skills/pdca/references/**"
      - "tests/pdca/test_routing_consistency.py"
      - "tests/pdca/test_frontmatter_yaml.py"
      - "skills/pdca/assets/install-agents-prompt.md"
      - "tests/pdca/test_install_agents_prompt.py"
      - "skills/pdca*/assets/claude-agents/**"
      - "skills/pdca*/assets/codex-agents/**"
      - "tools/pdca/gen_host_agents.py"
      - "tests/pdca/test_host_agent_artifacts.py"
      - ".github/workflows/pdca-role-assets.yml"
  pull_request:
    paths:
      - "skills/pdca*/**/*.py"
      - "skills/pdca*/tests/**"
      - "tests/pdca/test_skill_payload.py"
      - "skills/pdca/assets/opencode-agents/**"
      - "skills/pdca-coder/assets/opencode-agents/**"
      - "skills/pdca-dotnet/assets/opencode-agents/**"
      - "skills/pdca-collection/assets/opencode-agents/**"
      - "skills/pdca-incremental/assets/opencode-agents/**"
      - "tools/pdca/sync_role_assets.py"
      - "tests/pdca/test_role_assets.py"
      - "skills/pdca/SKILL.md"
      - "skills/pdca/references/**"
      - "tests/pdca/test_routing_consistency.py"
      - "tests/pdca/test_frontmatter_yaml.py"
      - "skills/pdca/assets/install-agents-prompt.md"
      - "tests/pdca/test_install_agents_prompt.py"
      - "skills/pdca*/assets/claude-agents/**"
      - "skills/pdca*/assets/codex-agents/**"
      - "tools/pdca/gen_host_agents.py"
      - "tests/pdca/test_host_agent_artifacts.py"
      - ".github/workflows/pdca-role-assets.yml"

permissions:
  contents: read

jobs:
  role-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check canonical roles and mirrors
        run: python3 tools/pdca/sync_role_assets.py --check
      - name: Install PyYAML (frontmatter gate dependency)
        run: python3 -m pip install pyyaml
      - name: Run role-asset tests
        run: python3 -m unittest discover -s tests/pdca -p 'test_role_assets.py' -v
      - name: Run frontmatter YAML gate
        run: python3 -m unittest discover -s tests/pdca -p 'test_frontmatter_yaml.py' -v
      - name: Run routing guards
        run: python3 -m unittest discover -s tests/pdca -p 'test_routing_consistency.py' -v
      - name: Check generated harness sets
        run: python3 tools/pdca/gen_host_agents.py --check
      - name: Run install-prompt guards
        run: python3 -m unittest discover -s tests/pdca -p 'test_install_agents_prompt.py' -v
      - name: Run generated-agent guards
        run: python3 -m unittest discover -s tests/pdca -p 'test_host_agent_artifacts.py' -v
      - name: Check installable skill contents
        run: python3 -m unittest discover -s tests/pdca -p 'test_skill_payload.py' -v
